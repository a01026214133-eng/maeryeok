  <title>오복신당 일주 테스트</title>
  <meta name="description" content="오복신당에서 나의 일주를 확인해보세요.">
  <meta property="og:title" content="오복신당 일주 테스트">
  <meta property="og:description" content="오복신당에서 나의 일주를 확인해보세요.">
  <meta property="og:type" content="website">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #2b1d0e; min-height: 100vh; }
    .page { max-width: 680px; margin: 0 auto; padding: 1.5rem; }

    /* Hero */
    .hero {
      background: linear-gradient(150deg, #160c02 0%, #2c1a08 25%, #3e240e 50%, #2e1c09 75%, #1a0e04 100%);
      border: 1px solid rgba(120,70,20,0.4);
      padding: 2rem 2rem 2rem; text-align: center; min-height: 260px;
      position: relative; overflow: hidden; border-radius: 16px; margin-bottom: 1.5rem;
    }
    .hero-inner {
      display: flex; align-items: center; gap: 1.2rem; position: relative; z-index: 1; flex-direction: row-reverse;
    }
    .hero-character-wrap {
      flex: 0 0 auto; width: 220px;
    }
    .hero-character {
      width: 220px; height: auto; display: block;
      filter: drop-shadow(0 4px 18px rgba(0,0,0,0.5));
    }
    .hero-text-wrap {
      flex: 1; text-align: left;
    }
    .hero-logo {
      height: 56px; width: auto; max-width: 100%;
      display: block; margin-bottom: 1rem;
      border-radius: 10px;
      filter: none;
    }
    @media (max-width: 480px) {
      .hero-inner { flex-direction: column-reverse; align-items: center; }
      .hero-character-wrap { width: 180px; }
      .hero-character { width: 180px; }
      .hero-text-wrap { text-align: center; }
      .hero-logo { margin: 0 auto 0.8rem; }
    }
    .hero::before {
      content:''; position:absolute; inset:0;
      background: radial-gradient(ellipse at 30% 40%, rgba(120,65,15,0.35) 0%, transparent 55%),
                  radial-gradient(ellipse at 70% 60%, rgba(80,40,8,0.25) 0%, transparent 55%);
    }
    .hero-stars { position:absolute; inset:0; pointer-events:none; }
    .star { position:absolute; width:2px; height:2px; background:rgba(255,220,140,0.8); border-radius:50%; animation:twinkle 3s infinite alternate; }
    @keyframes twinkle { 0%{opacity:0.15} 100%{opacity:0.9} }
    .hero-deco  { position:absolute; top:16px; right:24px; opacity:0.2; font-size:56px; color:#d4a040; pointer-events:none; line-height:1; }
    .hero-deco2 { position:absolute; bottom:14px; left:22px; opacity:0.14; font-size:42px; color:#c87020; pointer-events:none; }
    .hero-eyebrow { font-size:26px; letter-spacing:0.05em; font-family:'Noto Serif KR',serif; margin-bottom:0.7rem; position:relative; font-weight:700; background:linear-gradient(90deg,#f0c060,#e08030); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .hero-title { font-family:'Noto Serif KR',serif; font-size:15px; font-weight:700; color:#f5e6c0; line-height:1.7; position:relative; letter-spacing:0.01em; }
    .hero-title em { font-style:normal; color:#f5e6c0; -webkit-text-fill-color:#f5e6c0; }
    .hero-sub { font-size:13px; color:rgba(220,190,130,0.75); margin-top:0.7rem; position:relative; font-weight:300; line-height:1.8; }

    /* Form Card */
    .form-card { background:rgba(255,248,235,0.96); border:1px solid rgba(200,150,60,0.25); border-radius:14px; padding:1.8rem 1.8rem 1.5rem; margin-bottom:1.1rem; }
    .card-title { font-size:22px; font-weight:700; color:#3a1f00; font-family:'Noto Serif KR',serif; letter-spacing:0.02em; margin-bottom:0.4rem; text-align:center; }
    .card-desc { font-size:13px; color:#9a6830; font-weight:400; margin-bottom:1.6rem; letter-spacing:0.01em; text-align:center; }
    .section-label { font-size:15px; font-weight:700; letter-spacing:0.04em; color:#7a4010; margin-bottom:1.2rem; display:flex; align-items:center; gap:10px; font-family:'Noto Sans KR',sans-serif; }
    .section-label::after { content:''; flex:1; height:1px; background:rgba(180,130,50,0.3); }

    /* 날짜 */
    .date-row { display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; margin-bottom:1.2rem; }
    .date-field { display:flex; flex-direction:column; gap:6px; }
    .date-field label { font-size:12px; color:#7a5020; font-weight:400; }
    .field-input {
      height:50px; border:1px solid rgba(180,130,50,0.4); border-radius:8px; padding:0 14px;
      font-size:15px; font-family:inherit; background:#ffffff; color:#2b1d0e;
      outline:none; transition:border-color 0.15s; appearance:none; -webkit-appearance:none;
    }
    .field-input:focus { border-color:#c08030; box-shadow:0 0 0 2px rgba(192,128,48,0.15); }
    .year-input { width:98px; }
    .day-input  { width:78px; }

    /* 셀렉트 래퍼 */
    .sel-wrap { position:relative; display:flex; align-items:center; }
    .sel-wrap select {
      height:50px; border:1px solid rgba(180,130,50,0.4); border-radius:8px;
      padding:0 28px 0 14px; font-size:13px; font-family:inherit;
      background:#ffffff; color:#2b1d0e;
      appearance:none; -webkit-appearance:none; outline:none; cursor:pointer; display:block;
    }
    .sel-wrap select:focus { border-color:#c08030; box-shadow:0 0 0 2px rgba(192,128,48,0.15); }
    .sel-wrap select:disabled { opacity:0.4; cursor:default; }
    .sel-wrap::after { content:'▾'; font-size:11px; color:#a07030; position:absolute; right:10px; top:50%; transform:translateY(-50%); pointer-events:none; }
    .month-sel { width:86px; }
    .hour-sel  { width:260px; }
    .region-sel { min-width:150px; }

    /* 출생시간 */
    .time-group { display:flex; flex-direction:column; gap:6px; }
    .time-label { font-size:12px; color:#7a5020; }
    .time-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    .time-selects { display:flex; gap:8px; align-items:center; }
    .time-unit { font-size:14px; color:#7a5020; }

    /* 체크박스 */
    .checkbox-wrap { display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; color:#7a5020; user-select:none; }
    .checkbox-wrap input[type=checkbox] { display:none; }
    .custom-check { width:18px; height:18px; border:1.5px solid #c09050; border-radius:4px; display:flex; align-items:center; justify-content:center; background:#fff; flex-shrink:0; transition:all 0.15s; }
    .checkbox-wrap input:checked + .custom-check { background:#c08030; border-color:#c08030; }
    .custom-check-inner { font-size:11px; color:#fff; display:none; }
    .checkbox-wrap input:checked + .custom-check .custom-check-inner { display:block; }

    /* 라디오 */
    .radio-group { display:flex; gap:9px; flex-wrap:wrap; }
    .radio-pill { display:flex; align-items:center; gap:7px; padding:8px 16px; border-radius:20px; border:1.5px solid rgba(180,120,40,0.35); cursor:pointer; font-size:13px; color:#7a5020; background:#fff; transition:all 0.15s; user-select:none; }
    .radio-pill input { display:none; }
    .radio-dot { width:11px; height:11px; border-radius:50%; border:1.5px solid #c09050; background:#fff; flex-shrink:0; transition:all 0.15s; }
    .radio-pill.active { border-color:#c08030; background:rgba(192,128,48,0.08); color:#7a4010; }
    .radio-pill.active .radio-dot { background:#c08030; border-color:#c08030; }

    /* 출생지 */
    .select-row { display:flex; gap:10px; flex-wrap:wrap; }
    .select-wrap-outer { display:flex; flex-direction:column; gap:6px; }
    .select-wrap-outer label { font-size:12px; color:#7a5020; }

    /* 조회 버튼 */
    .submit-btn {
      width:100%; height:58px;
      background:linear-gradient(90deg,#8b4a10,#c07020,#8b4a10); background-size:200% auto;
      color:#fff5e0; font-size:16px; font-weight:500; font-family:'Noto Serif KR',serif;
      border:none; border-radius:12px; cursor:pointer; letter-spacing:0.08em; margin-top:0.4rem;
      transition:background-position 0.4s, transform 0.12s;
    }
    .submit-btn:hover { background-position:right center; transform:translateY(-1px); }
    .submit-btn:active { transform:scale(0.99); }
    .form-note { font-size:11px; color:rgba(220,190,130,0.55); text-align:center; margin-top:10px; }

    /* ── 오류 모달 ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }

    .modal-box {
      background: #fff8eb;
      border: 1.5px solid rgba(192,57,43,0.3);
      border-radius: 16px;
      padding: 2rem 1.8rem 1.5rem;
      max-width: 320px; width: 90%;
      text-align: center;
      animation: popIn 0.2s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    .modal-icon { font-size: 40px; margin-bottom: 0.8rem; }
    .modal-title {
      font-size: 17px; font-weight: 700;
      color: #7a1010; margin-bottom: 0.5rem;
    }
    .modal-msg {
      font-size: 13px; color: #9a4020;
      line-height: 1.7; margin-bottom: 1.4rem;
    }
    .modal-close {
      background: linear-gradient(90deg, #8b1010, #c03020);
      color: #fff; border: none; border-radius: 8px;
      padding: 10px 32px; font-size: 14px;
      cursor: pointer; font-weight: 500;
      transition: opacity 0.15s;
    }
    .modal-close:hover { opacity: 0.88; }

    /* 오류 칸 강조 테두리 */
    .error {
      border-color: #c0392b !important;
      box-shadow: 0 0 0 2px rgba(192,57,43,0.15) !important;
    }
  </style>
</head>
<body>

<!-- ── 오류 모달 ── -->
<div class="modal-overlay" id="error-modal">
  <div class="modal-box">
    <div class="modal-icon" id="modal-icon">⚠️</div>
    <p class="modal-title" id="modal-title">입력 오류</p>
    <p class="modal-msg" id="modal-msg"></p>
    <button class="modal-close" onclick="closeModal()">확인</button>
  </div>
</div>

            <option value="5">5월</option><option value="6">6월</option><option value="7">7월</option><option value="8">8월</option>
            <option value="9">9월</option><option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
          </select>
        </div>
      </div>
      <div class="date-field">
        <label>일</label>
        <input id="day-in" class="field-input day-input" type="number" placeholder="1" min="1" max="31">
      </div>
    </div>

    <div class="time-group">
      <div class="time-label">출생시간</div>
      <div class="time-row">
        <div class="time-selects" id="time-selects">
          <div class="sel-wrap">
            <select class="hour-sel" id="hour-sel">
              <option value="">시진 선택</option>
              <option value="자시">🐭 자시 (子時) 23:00~00:59</option>
              <option value="축시">🐂 축시 (丑時) 01:00~02:59</option>
              <option value="인시">🐯 인시 (寅時) 03:00~04:59</option>
              <option value="묘시">🐰 묘시 (卯時) 05:00~06:59</option>
              <option value="진시">🐲 진시 (辰時) 07:00~08:59</option>
              <option value="사시">🐍 사시 (巳時) 09:00~10:59</option>
              <option value="오시">🐴 오시 (午時) 11:00~12:59</option>
              <option value="미시">🐑 미시 (未時) 13:00~14:59</option>
              <option value="신시">🐒 신시 (申時) 15:00~16:59</option>
              <option value="유시">🐓 유시 (酉時) 17:00~18:59</option>
              <option value="술시">🐕 술시 (戌時) 19:00~20:59</option>
              <option value="해시">🐖 해시 (亥時) 21:00~22:59</option>
            </select>
          </div>

        </div>
        <label class="checkbox-wrap" onclick="toggleTime(this)">
          <input type="checkbox" id="no-time">
          <span class="custom-check"><span class="custom-check-inner">✓</span></span>
          출생시간 모름
        </label>
      </div>
    </div>
  </div>

  <div class="form-card">
    <div class="section-label">개인정보</div>
    <div style="margin-bottom:1.4rem;">
      <div style="font-size:12px;color:#7a5020;margin-bottom:8px;">성별</div>
      <div class="radio-group" id="gender-group">
        <label class="radio-pill" onclick="selectRadio(this,'gender-group')">
          <input type="radio" name="gender" value="male"><span class="radio-dot"></span>남성
        </label>
        <label class="radio-pill" onclick="selectRadio(this,'gender-group')">
          <input type="radio" name="gender" value="female"><span class="radio-dot"></span>여성
        </label>
        <label class="radio-pill" onclick="selectRadio(this,'gender-group')">
          <input type="radio" name="gender" value="other"><span class="radio-dot"></span>기타
        </label>
      </div>
    </div>
    <div>
      <div style="font-size:12px;color:#7a5020;margin-bottom:8px;">출생지</div>
      <div class="select-row">
        <div class="select-wrap-outer">
          <label>시/도</label>
          <div class="sel-wrap">
            <select class="region-sel" id="sido-sel" onchange="updateSigungu()">
              <option value="">시/도 선택</option>
            </select>
          </div>
        </div>
        <div class="select-wrap-outer">
          <label>시/군/구</label>
          <div class="sel-wrap">
            <select class="region-sel" id="sigungu-sel" disabled>
              <option value="">시/군/구 선택</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="submit-btn" onclick="doSubmit()">내 일주 확인하기 ✦</button>
  <p class="form-note">입력된 정보는 만세력 조회 목적에만 사용됩니다</p>
</div>

<script>
  /* ── 지역 데이터 ── */
  const regionData = {
    '서울특별시':['종로구','중구','용산구','성동구','광진구','동대문구','중랑구','성북구','강북구','도봉구','노원구','은평구','서대문구','마포구','양천구','강서구','구로구','금천구','영등포구','동작구','관악구','서초구','강남구','송파구','강동구'],
    '부산광역시':['중구','서구','동구','영도구','부산진구','동래구','남구','북구','해운대구','사하구','금정구','강서구','연제구','수영구','사상구','기장군'],
    '대구광역시':['중구','동구','서구','남구','북구','수성구','달서구','달성군','군위군'],
    '인천광역시':['중구','동구','미추홀구','연수구','남동구','부평구','계양구','서구','강화군','옹진군'],
    '광주광역시':['동구','서구','남구','북구','광산구'],
    '대전광역시':['동구','중구','서구','유성구','대덕구'],
    '울산광역시':['중구','남구','동구','북구','울주군'],
    '세종특별자치시':['세종시'],
    '경기도':['수원시','성남시','고양시','용인시','부천시','안산시','안양시','남양주시','화성시','평택시','의정부시','시흥시','파주시','김포시','광명시','광주시','군포시','하남시','오산시','이천시','안성시','의왕시','양평군','여주시','동두천시','과천시','가평군','연천군','포천시','양주시'],
    '강원특별자치도':['춘천시','원주시','강릉시','동해시','태백시','속초시','삼척시','홍천군','횡성군','영월군','평창군','정선군','철원군','화천군','양구군','인제군','고성군','양양군'],
    '충청북도':['청주시','충주시','제천시','보은군','옥천군','영동군','증평군','진천군','괴산군','음성군','단양군'],
    '충청남도':['천안시','공주시','보령시','아산시','서산시','논산시','계룡시','당진시','금산군','부여군','서천군','청양군','홍성군','예산군','태안군'],
    '전북특별자치도':['전주시','군산시','익산시','정읍시','남원시','김제시','완주군','진안군','무주군','장수군','임실군','순창군','고창군','부안군'],
    '전라남도':['목포시','여수시','순천시','나주시','광양시','담양군','곡성군','구례군','고흥군','보성군','화순군','장흥군','강진군','해남군','영암군','무안군','함평군','영광군','장성군','완도군','진도군','신안군'],
    '경상북도':['포항시','경주시','김천시','안동시','구미시','영주시','영천시','상주시','문경시','경산시','의성군','청송군','영양군','영덕군','청도군','고령군','성주군','칠곡군','예천군','봉화군','울진군','울릉군'],
    '경상남도':['창원시','진주시','통영시','사천시','김해시','밀양시','거제시','양산시','의령군','함안군','창녕군','고성군','남해군','하동군','산청군','함양군','거창군','합천군'],
    '제주특별자치도':['제주시','서귀포시']
  };

  const sidoSel = document.getElementById('sido-sel');
  const sigunguSel = document.getElementById('sigungu-sel');
  Object.keys(regionData).forEach(sido => {
    const opt = document.createElement('option');
    opt.value = sido; opt.textContent = sido;
    sidoSel.appendChild(opt);
  });

  function updateSigungu() {
    const sido = sidoSel.value;
    sigunguSel.innerHTML = '<option value="">시/군/구 선택</option>';
    if (sido && regionData[sido]) {
      regionData[sido].forEach(sg => {
        const opt = document.createElement('option');
        opt.value = sg; opt.textContent = sg;
        sigunguSel.appendChild(opt);
      });
      sigunguSel.disabled = false;
    } else {
      sigunguSel.disabled = true;
    }
  }

  function selectRadio(el, groupId) {
    document.querySelectorAll('#'+groupId+' .radio-pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
  }

  function toggleTime(label) {
    setTimeout(() => {
      const checked = label.querySelector('input').checked;
      const ts = document.getElementById('time-selects');
      ts.style.opacity = checked ? '0.3' : '1';
      ts.querySelector('select').disabled = checked;
    }, 0);
  }

  /* ── 오류 모달 함수 ── */
  function showModal(title, icon, msg) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-icon').textContent = icon;
    document.getElementById('modal-msg').innerHTML = msg;
    document.getElementById('error-modal').classList.add('show');
  }

  function closeModal() {
    document.getElementById('error-modal').classList.remove('show');
  }

  document.getElementById('error-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  function clearErrors() {
    document.querySelectorAll('.error').forEach(el => el.classList.remove('error'));
  }

  /* ── 조회 버튼 클릭 → 유효성 검사 ── */
  function doSubmit() {
    clearErrors();

    const year    = document.getElementById('year-in').value.trim();
    const month   = document.getElementById('month-in').value;
    const day     = document.getElementById('day-in').value.trim();
    const noTime  = document.getElementById('no-time').checked;
    const hour    = document.getElementById('hour-sel').value;
    const gender  = document.querySelector('input[name="gender"]:checked');
    const sido    = document.getElementById('sido-sel').value;
    const sigungu = document.getElementById('sigungu-sel').value;

    let errors = [];

    /* 연도 검사 */
    if (!year || year < 1900 || year > 2025) {
      document.getElementById('year-in').classList.add('error');
      errors.push('• 연도를 올바르게 입력해주세요 (1900~2025)');
    }
    /* 월 검사 */
    if (!month) {
      document.getElementById('month-in').classList.add('error');
      errors.push('• 월을 선택해주세요');
    }
    /* 일 검사 */
    if (!day || day < 1 || day > 31) {
      document.getElementById('day-in').classList.add('error');
      errors.push('• 일을 올바르게 입력해주세요 (1~31)');
    }
    /* 출생시간 검사 (출생시간 모름 체크 안 된 경우만) */
    if (!noTime) {
      if (!hour) {
        document.getElementById('hour-sel').classList.add('error');
        errors.push('• 출생 시진을 선택해주세요');
      }

    }
    /* 성별 검사 */
    if (!gender) {
      document.getElementById('gender-group').classList.add('error');
      errors.push('• 성별을 선택해주세요');
    }
    /* 출생지 시/도 검사 */
    if (!sido) {
      document.getElementById('sido-sel').classList.add('error');
      errors.push('• 출생지 시/도를 선택해주세요');
    }
    /* 출생지 시/군/구 검사 */
    if (!sigungu) {
      document.getElementById('sigungu-sel').classList.add('error');
      errors.push('• 출생지 시/군/구를 선택해주세요');
    }

    /* 오류가 하나라도 있으면 모달 표시 */
    if (errors.length > 0) {
      showModal(
        '입력 정보를 확인해주세요',
        '⚠️',
        '입력하지 않은 항목이 있습니다.<br><br>' +
        '<span style="font-size:12px;color:#c0392b;text-align:left;display:block;line-height:2;">'
        + errors.join('<br>') +
        '</span>'
      );
      return;
    }

    /* ✅ 모든 항목 정상 입력 시 — 결과 페이지로 이동 */
    const noTimeVal = noTime ? '1' : '0';
    const params = new URLSearchParams({
      year, month, day,
      hour: noTime ? '' : hour,
      noTime: noTimeVal,
      gender: gender ? gender.value : '',
      sido, sigungu
    });
    window.location.href = 'manseryeok_result.html?' + params.toString();
  }

  /* ── 별 생성 ── */
  const starsBg = document.getElementById('stars-bg');
  for (let i = 0; i < 30; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*4}s;`;
    starsBg.appendChild(s);
  }
</script>
</body>
</html>
